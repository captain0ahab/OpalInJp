<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鉱物産地探索マップ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: 'Hiragino Sans', 'Yu Gothic', 'Meiryo', sans-serif; }
body { display: flex; flex-direction: column; background: #1a1a2e; color: #e8e8e8; }

/* ── ヘッダー ── */
header {
  padding: 8px 16px;
  background: #12122a;
  border-bottom: 2px solid #2980b9;
  display: flex; align-items: center; gap: 12px;
  flex-shrink: 0; z-index: 1000;
}
header h1 { font-size: 1rem; letter-spacing: 0.05em; }
.hint { margin-left: auto; font-size: 0.72rem; color: #7fb3d3; }

/* ── メイン ── */
.main { display: flex; flex: 1; overflow: hidden; }

/* ── サイドバー ── */
.sidebar {
  width: 260px; flex-shrink: 0;
  background: #12122a;
  border-right: 1px solid #1e3a5f;
  display: flex; flex-direction: column;
  overflow: hidden;
}
.ctrl-panel { padding: 12px; border-bottom: 1px solid #1e3a5f; flex-shrink: 0; }
.result-panel { flex: 1; overflow-y: auto; padding: 10px; }

/* フォーム */
.fg { margin-bottom: 11px; }
.fg label {
  display: block; font-size: 0.69rem; color: #8baabf;
  text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px;
}
select {
  width: 100%; padding: 6px 8px;
  background: #1e3a5f; border: 1px solid #2d6a9f;
  border-radius: 4px; color: #e8e8e8; font-size: 0.87rem; cursor: pointer;
}
select:focus { outline: none; border-color: #5dade2; }

.radius-row { display: flex; align-items: center; gap: 8px; }
.radius-row input[type=range] { flex: 1; cursor: pointer; accent-color: #2980b9; }
.radius-val { font-size: 0.87rem; min-width: 48px; text-align: right; color: #5dade2; font-weight: bold; }

.coord-box {
  background: #0d1b2e; border: 1px solid #1e3a5f; border-radius: 4px;
  padding: 6px 8px; font-size: 0.79rem; color: #7fb3d3; margin-bottom: 11px;
  font-family: 'Courier New', monospace;
}

.btn-search {
  width: 100%; padding: 9px;
  background: #2980b9; color: white; border: none;
  border-radius: 4px; cursor: pointer;
  font-size: 0.93rem; font-weight: bold;
  transition: background 0.15s;
}
.btn-search:hover:not(:disabled) { background: #3498db; }
.btn-search:disabled { background: #1e3357; color: #4a6fa5; cursor: default; }

.btn-copy {
  width: 100%; padding: 7px; margin-top: 6px;
  background: #1e3a5f; color: #7fb3d3; border: 1px solid #2d6a9f;
  border-radius: 4px; cursor: pointer;
  font-size: 0.82rem; transition: background 0.15s;
}
.btn-copy:hover { background: #2d5a8e; color: #e8e8e8; }

/* ── 半径プリセットボタン（デスクトップでは非表示） ── */
.radius-presets { display: none; gap: 4px; }
.r-preset {
  flex: 1; padding: 10px 4px;
  background: #1e3a5f; color: #7fb3d3;
  border: 1px solid #2d6a9f; border-radius: 5px;
  cursor: pointer; font-size: 0.85rem; font-weight: bold;
  transition: background 0.15s; touch-action: manipulation;
}
.r-preset.active {
  background: #2980b9; color: #fff;
  border-color: #5dade2;
}
.r-preset:active { background: #3498db; color: #fff; }

/* ── 場所検索バー ── */
.place-search-row { display: flex; gap: 5px; margin-bottom: 11px; }
.place-input {
  flex: 1; padding: 6px 8px;
  background: #1e3a5f; border: 1px solid #2d6a9f;
  border-radius: 4px; color: #e8e8e8; font-size: 0.87rem;
}
.place-input::placeholder { color: #4a6fa5; }
.place-input:focus { outline: none; border-color: #5dade2; }
.btn-place {
  padding: 6px 10px;
  background: #1e3a5f; color: #7fb3d3; border: 1px solid #2d6a9f;
  border-radius: 4px; cursor: pointer; font-size: 0.82rem;
  white-space: nowrap; transition: background 0.15s;
}
.btn-place:hover  { background: #2d5a8e; color: #e8e8e8; }
.btn-place:disabled { color: #4a6fa5; cursor: default; }

/* Leaflet 現在位置ボタン */
.leaflet-control-location {
  width: 34px; height: 34px;
  background: #12122a !important; border: 2px solid #2d6a9f !important;
  border-radius: 5px; cursor: pointer; font-size: 1.1rem;
  display: flex; align-items: center; justify-content: center;
  color: #7fb3d3; transition: background 0.15s; line-height: 1;
}
.leaflet-control-location:hover    { background: #1e3a5f !important; color: #5dade2; }
.leaflet-control-location:disabled { color: #4a6fa5; cursor: default; }

/* ドロワー専用要素（デスクトップでは非表示） */
.drawer-handle, .mini-bar { display: none; }

/* ── スマートフォン対応: フルスクリーン地図 + ボトムドロワー ── */
@media (max-width: 767px) {
  header { display: none; }
  html, body { overflow: hidden; }

  .main { position: fixed; inset: 0; display: block; }

  #map {
    position: absolute;
    inset: 0;
    height: 100% !important;
    flex: none;
  }

  /* Leaflet ズームボタンをドロワーの上に */
  .leaflet-bottom { bottom: 80px !important; }
  .leaflet-control-attribution { font-size: 0.48rem !important; }

  /* ── ドロワー本体 ── */
  .sidebar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    width: 100%;
    height: 72px;           /* ミニ状態 */
    border-right: none;
    border-top: 2px solid #2980b9;
    border-radius: 16px 16px 0 0;
    background: #12122a;
    overflow: hidden;
    transition: height 0.32s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 1001;
    display: flex;
    flex-direction: column;
    box-shadow: 0 -4px 20px rgba(0,0,0,0.5);
  }

  .sidebar.drawer-open {
    height: 58vh;
    overflow-y: auto;   /* ドロワー全体をスクロール可能に */
  }

  /* ハンドルはスクロール時も最上部に固定 */
  .sidebar.drawer-open .drawer-handle {
    position: sticky;
    top: 0;
    background: #12122a;
    z-index: 2;
  }

  /* 結果パネルはドロワースクロールに任せる */
  .sidebar.drawer-open .result-panel {
    overflow-y: visible;
    flex: none;
    min-height: 200px;
  }

  /* ── ドラッグハンドル ── */
  .drawer-handle {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 22px;
    cursor: pointer;
    flex-shrink: 0;
    padding: 6px 0 2px;
    touch-action: none;
  }
  .drawer-handle::before {
    content: '';
    width: 36px; height: 4px;
    background: #2d6a9f;
    border-radius: 2px;
    transition: background 0.15s;
  }
  .drawer-handle:active::before { background: #5dade2; }

  /* ── ミニバー（折りたたみ時） ── */
  .mini-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 14px 10px;
    flex-shrink: 0;
  }
  .mini-icon { width: 20px; height: 20px; flex-shrink: 0; }
  .mini-icon svg { width: 20px; height: 20px; }
  .mini-info {
    flex: 1;
    font-size: 0.78rem; color: #7fb3d3;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .mini-btn {
    padding: 6px 12px;
    background: #2980b9; color: white;
    border: none; border-radius: 6px;
    font-size: 1rem; cursor: pointer; flex-shrink: 0;
    transition: background 0.15s;
  }
  .mini-btn:active { background: #3498db; }
  .mini-btn:disabled { background: #1e3357; color: #4a6fa5; cursor: default; }

  /* 展開時はミニバーを隠す */
  .sidebar.drawer-open .mini-bar { display: none; }

  /* ── コントロールパネル（展開時のみ） ── */
  .ctrl-panel {
    display: none;
    padding: 6px 12px 8px;
    border-bottom: 1px solid #1e3a5f;
    flex-shrink: 0;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    align-items: end;
  }
  .sidebar.drawer-open .ctrl-panel { display: grid; }

  .place-search-row { grid-column: 1 / -1; margin-bottom: 0; }
  .place-input { font-size: 0.82rem; }
  .coord-box   { grid-column: 1 / -1; font-size: 0.72rem; margin-bottom: 0; }
  .fg          { margin-bottom: 0; }
  .fg:nth-child(3) { grid-column: 1 / -1; } /* 鉱物: 全幅 */
  .fg:nth-child(4) { display: none; }        /* スライダー: 非表示 */
  .radius-presets  { display: flex; grid-column: 1 / -1; }
  .btn-search  { grid-column: 1; padding: 8px; font-size: 0.82rem; }
  .btn-copy    { grid-column: 2; margin-top: 0; }

  /* ── 結果パネル（展開時のみ・スクロール） ── */
  .result-panel {
    display: none;
    flex: 1;
    overflow-y: auto;
    padding: 6px 10px;
    -webkit-overflow-scrolling: touch;
  }
  .sidebar.drawer-open .result-panel { display: block; }

  .result-hdr  { font-size: 0.7rem; }
  .mineral-info { margin-bottom: 6px; }
  .card        { padding: 6px 8px; }
  .card-score  { font-size: 1rem; }
}

/* 結果ヘッダー */
.result-hdr {
  font-size: 0.72rem; color: #8baabf;
  padding: 4px 0 8px; border-bottom: 1px solid #1e3a5f; margin-bottom: 8px;
  display: none;
}
.result-hdr b { color: #5dade2; }

.loading-msg { text-align: center; color: #8baabf; font-size: 0.82rem; padding: 20px 0; display: none; }

/* 結果カード */
.card {
  background: #0d1b2e; border-radius: 5px;
  border-left: 3px solid #2980b9;
  padding: 8px 10px; margin-bottom: 5px;
  cursor: pointer; transition: background 0.1s;
}
.card:hover { background: #142840; }
.card-top { display: flex; align-items: baseline; gap: 6px; margin-bottom: 2px; }
.card-score { font-size: 1.1rem; font-weight: bold; }
.card-dist { font-size: 0.74rem; color: #7fb3d3; }
.badge {
  display: inline-block; font-size: 0.6rem;
  padding: 1px 5px; border-radius: 3px; vertical-align: middle;
}
.b-fault  { background: #922b21; }
.b-hot    { background: #1a5276; }
.card-lith { font-size: 0.74rem; color: #aaa; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-age  { font-size: 0.7rem; color: #6ca; }

/* ── マップ ── */
#map { flex: 1; background: #1a1a2e; }

/* GSIタイルをダークモード化（色反転 + 色相補正） */
.dark-tiles { filter: invert(100%) hue-rotate(180deg) brightness(0.85) contrast(0.9); }

/* ── Leaflet ポップアップ ── */
.leaflet-popup-content-wrapper {
  background: #0d1b2e; color: #e8e8e8;
  border: 1px solid #2980b9; border-radius: 6px;
  box-shadow: 0 3px 14px rgba(0,0,0,.5);
}
.leaflet-popup-tip { background: #0d1b2e; }
.leaflet-popup-close-button {
  color: #7fb3d3 !important;
  font-size: 1.4rem !important;
  width: 32px !important; height: 32px !important;
  top: 4px !important; right: 4px !important;
  line-height: 32px !important;
}
.leaflet-popup-content {
  font-size: 0.81rem; line-height: 1.65; min-width: 220px;
  max-height: 60vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.p-close {
  display: block; width: 100%; margin-top: 8px;
  padding: 8px; background: #1e3a5f; color: #7fb3d3;
  border: 1px solid #2d6a9f; border-radius: 4px;
  cursor: pointer; font-size: 0.82rem; text-align: center;
  transition: background 0.15s;
}
.p-close:hover { background: #2d5a8e; color: #e8e8e8; }
.p-score { font-size: 1.1rem; font-weight: bold; }
.p-divider { border-top: 1px solid #1e3a5f; margin: 6px 0; }
.p-minerals { font-size: 0.73rem; color: #8baabf; line-height: 1.7; }
.p-minerals b { color: #f0b429; }
.p-gmap { display: inline-block; margin-top: 6px; color: #5dade2; font-size: 0.75rem; text-decoration: none; }
.p-gmap:hover { text-decoration: underline; }
.p-formation { font-size: 0.71rem; color: #a9cce3; line-height: 1.6; margin-top: 5px; }
.p-formation strong { color: #5dade2; }
.mineral-info {
  background: #0a1628; border: 1px solid #2d5a8e; border-radius: 5px;
  padding: 8px 10px; margin-bottom: 8px;
  display: flex; align-items: flex-start; gap: 9px;
}
.mineral-info-icon { flex-shrink: 0; width: 28px; height: 28px; }
.mineral-info-icon svg { width: 28px; height: 28px; }
.mineral-info-text { font-size: 0.71rem; color: #a9cce3; line-height: 1.6; }
.mineral-info-text b { color: #5dade2; }

/* ── レイヤー切り替えセクション ── */
.layer-section {
  padding: 8px 12px 10px;
  border-bottom: 1px solid #1e3a5f;
  flex-shrink: 0;
}
.layer-section-label {
  font-size: 0.69rem; color: #8baabf;
  text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 5px;
}
.layer-btns { display: flex; gap: 6px; }
.btn-layer {
  flex: 1; padding: 7px 4px;
  background: #1e3a5f; color: #4a6fa5;
  border: 1px solid #2d6a9f; border-radius: 4px;
  cursor: pointer; font-size: 0.8rem; transition: background 0.15s;
}
.btn-layer.active { background: #1e4a7a; color: #e8e8e8; border-color: #5dade2; }
.btn-layer:hover  { background: #2d5a8e; color: #e8e8e8; }

/* ── ベースマップ切り替えボタン ── */
.basemap-btns { display: flex; flex-wrap: wrap; gap: 4px; }
.btn-basemap {
  flex: 1 0 calc(33% - 3px);
  padding: 5px 3px;
  font-size: 0.73rem; text-align: center; line-height: 1.35;
  background: #1e3a5f; color: #4a6fa5;
  border: 1px solid #2d6a9f; border-radius: 4px;
  cursor: pointer; transition: background 0.15s;
}
.btn-basemap.active { background: #1e4a7a; color: #e8e8e8; border-color: #5dade2; }
.btn-basemap:hover  { background: #2d5a8e; color: #e8e8e8; }

/* Leaflet ツールチップ（ダークテーマ） */
.leaflet-tooltip {
  background: #0d1b2e; color: #e8e8e8;
  border: 1px solid #2d6a9f; border-radius: 4px;
  font-family: 'Hiragino Sans', 'Yu Gothic', 'Meiryo', sans-serif;
  font-size: 0.78rem; white-space: nowrap;
  box-shadow: 0 2px 8px rgba(0,0,0,.5);
}
.leaflet-tooltip-top::before  { border-top-color:    #2d6a9f !important; }
.leaflet-tooltip-bottom::before { border-bottom-color: #2d6a9f !important; }

/* 既知産地・伝説ポップアップ */
.p-locality-name { font-size: 1rem; font-weight: bold; color: #f0b429; margin-bottom: 4px; }
.p-legend-title  { font-size: 1rem; font-weight: bold; color: #f39c12; margin-bottom: 6px; }
.p-legend-text   { font-size: 0.78rem; color: #d5dbdb; line-height: 1.75; }

/* スコア根拠 */
.p-rationale-title {
  font-size: 0.75rem; font-weight: bold; color: #5dade2;
  text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 5px;
}
.p-rationale { font-size: 0.77rem; color: #c8d8e8; line-height: 1.75; }
.p-rationale b { color: #e8e8e8; }
.p-breakdown { margin-top: 6px; }
.p-breakdown summary {
  font-size: 0.72rem; color: #7fb3d3; cursor: pointer;
  list-style: none; padding: 2px 0;
}
.p-breakdown summary::-webkit-details-marker { display: none; }
.p-breakdown summary::before { content: '▶ '; font-size: 0.65rem; }
details[open] .p-breakdown summary::before { content: '▼ '; }

@media (max-width: 767px) {
  .layer-section { display: none; }
  .sidebar.drawer-open .layer-section { display: block; padding: 6px 12px 8px; }
}
</style>
</head>
<body>

<header>
  <span style="font-size:1.3rem">🗾</span>
  <h1>鉱物産地探索マップ</h1>
  <span class="hint">地図をクリック → 鉱物・半径を選択 → 調査</span>
</header>

<div class="main">

  <!-- ── サイドバー（モバイル: ボトムドロワー） ── -->
  <div class="sidebar" id="drawer">
    <!-- ドラッグハンドル（タップで開閉） -->
    <div class="drawer-handle" id="drawerHandle"></div>
    <!-- ミニバー（折りたたみ時に表示） -->
    <div class="mini-bar" id="miniBar">
      <div class="mini-icon" id="miniIcon"></div>
      <div class="mini-info" id="miniInfo">地図をタップして選択</div>
      <button class="mini-btn" id="miniSearchBtn" onclick="doSearch()" disabled>🔍</button>
    </div>
    <div class="ctrl-panel">

      <!-- 場所検索 -->
      <div class="place-search-row">
        <input type="text" id="placeInput" class="place-input"
               placeholder="地名・住所で検索…"
               onkeydown="if(event.key==='Enter')searchPlace()">
        <button class="btn-place" id="placeBtn" onclick="searchPlace()">検索</button>
      </div>

      <div class="coord-box" id="coordBox">地図・検索で調査地点を選択</div>

      <div class="fg">
        <label>対象鉱物</label>
        <select id="mineralSel">
          <option value="all">── 全鉱物（合計スコア）</option>
          {% for key, name in minerals.items() %}
          <option value="{{ key }}">{{ name }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="fg">
        <label>調査半径</label>
        <div class="radius-row">
          <input type="range" id="radiusSl" min="1" max="100" value="20"
                 oninput="document.getElementById('radiusNum').textContent=this.value">
          <span class="radius-val"><span id="radiusNum">20</span> km</span>
        </div>
      </div>

      <!-- モバイル用半径プリセット -->
      <div class="radius-presets">
        <button class="r-preset" data-km="5"   onclick="setRadius(5)">5km</button>
        <button class="r-preset" data-km="10"  onclick="setRadius(10)">10km</button>
        <button class="r-preset active" data-km="20" onclick="setRadius(20)">20km</button>
        <button class="r-preset" data-km="50"  onclick="setRadius(50)">50km</button>
        <button class="r-preset" data-km="100" onclick="setRadius(100)">100km</button>
      </div>

      <button class="btn-search" id="searchBtn" onclick="doSearch()" disabled>
        🔍 この地点を調査する
      </button>
      <button class="btn-copy" id="copyBtn" onclick="copyUrl()" style="display:none">
        🔗 このURLをコピー
      </button>
    </div>

    <!-- ベースマップ切り替え -->
    <div class="layer-section">
      <div class="layer-section-label">ベースマップ</div>
      <div class="basemap-btns">
        <button class="btn-basemap" data-basemap="osm"       onclick="switchBasemap('osm')">OSM</button>
        <button class="btn-basemap" data-basemap="std"       onclick="switchBasemap('std')">標準地図</button>
        <button class="btn-basemap" data-basemap="hillshade" onclick="switchBasemap('hillshade')">陰影起伏図</button>
        <button class="btn-basemap active" data-basemap="carto" onclick="switchBasemap('carto')">ダーク</button>
        <button class="btn-basemap" data-basemap="esri"      onclick="switchBasemap('esri')">衛星</button>
      </div>
    </div>

    <!-- レイヤー切り替え -->
    <div class="layer-section">
      <div class="layer-section-label">地図レイヤー</div>
      <div class="layer-btns">
        <button class="btn-layer active" id="btnLocalityLayer" onclick="toggleLayer('locality')">
          ⭐ 既知産地
        </button>
        <button class="btn-layer active" id="btnLegendLayer" onclick="toggleLayer('legend')">
          📜 伝説・逸話
        </button>
        <button class="btn-layer" id="btnRiverLayer" onclick="onRiverLayerBtn()" disabled>
          河川スコア
        </button>
      </div>
      <div class="layer-btns" style="margin-top:5px">
        <button class="btn-layer" id="btnParkLayer" onclick="onParkLayerBtn()" disabled>
          🚫 保護区
        </button>
        <button class="btn-layer" id="btnHotspringLayer" onclick="onOverlayBtn('hotspring')" disabled>
          ♨ 温泉
        </button>
        <button class="btn-layer" id="btnMineLayer" onclick="onOverlayBtn('mine')" disabled>
          ⛏ 鉱山跡
        </button>
      </div>
    </div>

    <div class="result-panel">
      <div class="result-hdr" id="resultHdr"></div>
      <div class="mineral-info" id="mineralInfo" style="display:none"></div>
      <div class="loading-msg" id="loadingMsg">⏳ 検索中...</div>
      <div id="resultList"></div>
    </div>
  </div>

  <!-- ── 地図 ── -->
  <div id="map"></div>

</div><!-- .main -->

// ── 地図初期化 ─────────────────────────────────────────
const map = L.map('map', { center:[36.5, 137.0], zoom:6 });

const BASEMAPS = {
  osm: {
    url: 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    options: { attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors', maxZoom:19 }

  std: {

  },

  }

let currentBaseTile = L.tileLayer(BASEMAPS.carto.url, BASEMAPS.carto.options).addTo(map);

function switchBasemap(id) {
  const cfg = BASEMAPS[id];
  if (!cfg) return;
  map.removeLayer(currentBaseTile);
  currentBaseTile = L.tileLayer(cfg.url, cfg.options).addTo(map);
  currentBaseTile.bringToBack();
  document.querySelectorAll('.btn-basemap').forEach(b => b.classList.remove('active'));
  document.querySelector('.btn-basemap[data-basemap="' + id + '"]').classList.add('active');
}

// 東京
L.circleMarker([35.6895, 139.6917], {
  radius:7, color:'#2980b9', fillColor:'#3498db', fillOpacity:0.9, weight:2
}).bindTooltip('東京', {permanent:true, direction:'right', className:'tokyo-tip'}).addTo(map);

// ── 状態 ─────────────────────────────────────────────
let selLat = null, selLon = null;
let pinMarker = null, radiusCircle = null;
const resultLayer = L.layerGroup().addTo(map);
const riverLayer  = L.layerGroup().addTo(map);
let riverVisible        = true;
let riverFetched        = false;
let riverAbortController = null;

// ── モバイルドロワー制御 ──────────────────────────────────────
const drawer = document.getElementById('drawer');
document.getElementById('drawerHandle').addEventListener('click', () => {
  drawer.classList.toggle('drawer-open');
});

function updateMiniBar() {
  if (window.innerWidth > 767) return;
  const mineral = document.getElementById('mineralSel').value;
  const radius  = document.getElementById('radiusSl').value;
  const mName   = MINERAL_NAMES[mineral] || '全鉱物';
  document.getElementById('miniIcon').innerHTML = MINERAL_ICON_SVG[mineral] || MINERAL_ICON_SVG.all;
  document.getElementById('miniInfo').textContent =
    mName + '  ' + radius + 'km' +
    (selLat ? '  📍' + selLat.toFixed(2) + '°N' : '  地図をタップ');
  document.getElementById('miniSearchBtn').disabled = !selLat;
}

// ── ピン設置ヘルパー ────────────────────────────────────────
function setPin(lat, lon) {
  selLat = lat; selLon = lon;
  document.getElementById('coordBox').textContent = lat + '°N,  ' + lon + '°E';
  document.getElementById('searchBtn').disabled = false;
  if (pinMarker) map.removeLayer(pinMarker);
  pinMarker = L.marker([lat, lon], {
    icon: L.divIcon({
      html: '<div style="font-size:26px;transform:translate(-50%,-100%)">📍</div>',
      iconSize: [0, 0], className: ''
    })
  }).addTo(map);
  updateMiniBar();
}

// ── 場所検索（Nominatim）────────────────────────────────────
async function searchPlace() {
  const q = document.getElementById('placeInput').value.trim();
  if (!q) return;
  const btn = document.getElementById('placeBtn');
  const orig = btn.textContent;
  btn.textContent = '…'; btn.disabled = true;
  try {
    const params = new URLSearchParams({
      q, format: 'json', limit: 1, countrycodes: 'jp', 'accept-language': 'ja'
    });
    const res  = await fetch('https://nominatim.openstreetmap.org/search?' + params);
    const data = await res.json();
    if (!data.length) { alert('「' + q + '」が見つかりませんでした'); return; }
    const la = parseFloat((+data[0].lat).toFixed(5));
    const lo = parseFloat((+data[0].lon).toFixed(5));
    setPin(la, lo);
    const bb = data[0].boundingbox;
    if (bb) map.fitBounds([[+bb[0], +bb[2]], [+bb[1], +bb[3]]], { maxZoom: 13 });
    else    map.setView([la, lo], 12);
  } catch(e) {
    alert('検索エラー: ' + e.message);
  } finally {
    btn.textContent = orig; btn.disabled = false;
  }
}

// ── 現在位置 ─────────────────────────────────────────────────
function goToCurrentLocation() {
  if (!navigator.geolocation) { alert('位置情報を利用できません'); return; }
  const btn = document.getElementById('locationBtn');
  if (btn) { btn.innerHTML = '⌛'; btn.disabled = true; }
  navigator.geolocation.getCurrentPosition(
    pos => {
      const la = parseFloat(pos.coords.latitude.toFixed(5));
      const lo = parseFloat(pos.coords.longitude.toFixed(5));
      setPin(la, lo);
      map.setView([la, lo], 12);
      if (btn) { btn.innerHTML = '🎯'; btn.disabled = false; }
    },
    () => {
      alert('位置情報の取得に失敗しました');
      if (btn) { btn.innerHTML = '🎯'; btn.disabled = false; }
    },
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

// ── Leaflet 現在位置コントロール ──────────────────────────────
const LocationControl = L.Control.extend({
  onAdd: function() {
    const btn = L.DomUtil.create('button', 'leaflet-control-location');
    btn.id = 'locationBtn'; btn.innerHTML = '🎯'; btn.title = '現在地を表示';
    L.DomEvent.disableClickPropagation(btn);
    btn.onclick = goToCurrentLocation;
    return btn;
  }
});
new LocationControl({ position: 'bottomright' }).addTo(map);

// ── 地図クリック ───────────────────────────────────────
map.on('click', e => {
  setPin(parseFloat(e.latlng.lat.toFixed(5)), parseFloat(e.latlng.lng.toFixed(5)));
});

// ── 検索 ─────────────────────────────────────────────
function doSearch() {
  if (!selLat) return;

  const radius  = document.getElementById('radiusSl').value;
  const mineral = document.getElementById('mineralSel').value;
  const btn     = document.getElementById('searchBtn');

  // URL を更新（シェア用）
  const params = new URLSearchParams({ lat: selLat, lon: selLon, radius_km: radius, mineral });
  history.pushState(null, '', '?' + params.toString());
  document.getElementById('copyBtn').style.display = 'block';

  btn.disabled = true;
  document.getElementById('loadingMsg').style.display = 'block';
  document.getElementById('resultHdr').style.display  = 'none';
  document.getElementById('mineralInfo').style.display = 'none';
  document.getElementById('resultList').innerHTML = '';
  resultLayer.clearLayers();
  riverLayer.clearLayers();
  riverFetched = false;
  if (riverAbortController) { riverAbortController.abort(); riverAbortController = null; }
  const riverBtn = document.getElementById('btnRiverLayer');
  if (riverBtn) { riverBtn.disabled = false; riverBtn.classList.remove('active'); riverBtn.textContent = '河川スコア'; }

  // オーバーレイリセット
  if (overlayAbortController) { overlayAbortController.abort(); overlayAbortController = null; }
  overlayFetched = false;
  overlayData    = null;
  parkLayer.clearLayers();
  hotspringLayer.clearLayers();
  mineLayer.clearLayers();
  if (map.hasLayer(hotspringLayer)) map.removeLayer(hotspringLayer);
  if (map.hasLayer(mineLayer))      map.removeLayer(mineLayer);
  hotspringVisible = false;
  mineVisible      = false;
  parkVisible      = true;
  ['btnParkLayer','btnHotspringLayer','btnMineLayer'].forEach(function(id) {
    const btn = document.getElementById(id);
    if (!btn) return;
    btn.disabled = true;
    btn.classList.remove('active');
  });
  document.getElementById('btnParkLayer').textContent      = '🚫 保護区';
  document.getElementById('btnHotspringLayer').textContent = '♨ 温泉';
  document.getElementById('btnMineLayer').textContent      = '⛏ 鉱山跡';

  if (radiusCircle) map.removeLayer(radiusCircle);
  radiusCircle = L.circle([selLat, selLon], {
    radius: radius * 1000,
    color:'#2980b9', fillColor:'#2980b9', fillOpacity:0.05,
    weight:1.5, dashArray:'6 4'
  }).addTo(map);

  fetch('/api/search?lat=' + selLat + '&lon=' + selLon +
        '&radius_km=' + radius + '&mineral=' + mineral)
    .then(r => r.json())
    .then(renderResults)
    .catch(err => {
      const msg = (err.message === 'Failed to fetch')
        ? '通信エラー：インターネット接続を確認してください'
        : 'エラー: ' + err.message;
      const hdr = document.getElementById('resultHdr');
      hdr.innerHTML = '<span style="color:#e74c3c">' + msg + '</span>';
      hdr.style.display = 'block';
    })
    .finally(() => {
      btn.disabled = false;
      document.getElementById('loadingMsg').style.display = 'none';
    });

  // オーバーレイ（保護区・温泉・鉱山跡）を非同期取得
  fetchOverlays();
}

// ── URL コピー ────────────────────────────────────────
function copyUrl() {
  navigator.clipboard.writeText(location.href).then(() => {
    const btn = document.getElementById('copyBtn');
    const orig = btn.textContent;
    btn.textContent = '✅ コピーしました';
    setTimeout(() => btn.textContent = orig, 2000);
  });
}

// ── URL パラメーターから自動復元 ──────────────────────
(function restoreFromUrl() {
  const p = new URLSearchParams(location.search);
  if (!p.has('lat') || !p.has('lon')) {
    // URL パラメーターなし → 現在位置で初期表示
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        pos => map.setView([pos.coords.latitude, pos.coords.longitude], 10),
        () => {} // 失敗時はデフォルト中心（日本）のまま
      );
    }
    return;
  }

  const radius  = p.get('radius_km') || '20';
  const mineral = p.get('mineral')   || 'all';
  document.getElementById('radiusSl').value        = radius;
  document.getElementById('radiusNum').textContent = radius;
  syncRadiusPresets(+radius);
  document.getElementById('mineralSel').value      = mineral;
  setPin(parseFloat(p.get('lat')), parseFloat(p.get('lon')));

  map.setView([selLat, selLon], 9);
  doSearch();
})();

// ── 結果描画 ──────────────────────────────────────────
function ratioColor(ratio) {
  if (ratio >= 0.75) return '#e74c3c';
  if (ratio >= 0.50) return '#e67e22';
  if (ratio >= 0.25) return '#f1c40f';
  return '#5dade2';
}

function mineralBreakdown(row, labels) {
  const parts = [];
  for (const key of MINERAL_KEYS) {
    const v = row['score_' + key];
    if (v && v > 0) {
      const nm = (labels && labels[key]) || MINERAL_NAMES[key] || key;
      parts.push('<span style="color:#8baabf">' + nm + ':</span> <b>' + v.toFixed(1) + '</b>');
    }
  }
  if (row.score_hydrothermal && row.score_hydrothermal > 0)
    parts.push('<span style="color:#8baabf">熱水変質:</span> <b>' + row.score_hydrothermal.toFixed(1) + '</b>');
  return parts.join('&ensp;');
}

function renderResults(data) {
  document.getElementById('loadingMsg').style.display = 'none';
  // モバイル: 検索完了でドロワーを自動展開
  if (window.innerWidth <= 767) drawer.classList.add('drawer-open');

  const hdr     = document.getElementById('resultHdr');
  const list    = document.getElementById('resultList');
  const mineral = document.getElementById('mineralSel').value;
  hdr.style.display = 'block';

  // 生成プロセス情報パネルを更新
  const infoDiv = document.getElementById('mineralInfo');
  infoDiv.innerHTML =
    '<div class="mineral-info-icon">' + (MINERAL_ICON_SVG[mineral] || MINERAL_ICON_SVG.all) + '</div>' +
    '<div class="mineral-info-text"><b>' + (MINERAL_NAMES[mineral] || '全鉱物') + 'の生成プロセス:</b><br>' +
    (MINERAL_FORMATION[mineral] || MINERAL_FORMATION.all) + '</div>';
  infoDiv.style.display = 'flex';

  if (!data.results || data.results.length === 0) {
    hdr.innerHTML = 'この範囲に有望ポリゴンなし';
    return;
  }

  hdr.innerHTML = '範囲内 <b>' + data.count + '</b> ポリゴン / 上位 <b>' + data.results.length + '</b> 件';

  const maxScore = data.max_score || 1;

  data.results.forEach(row => {
    const score = row.sort_score || 0;
    const ratio = maxScore > 0 ? score / maxScore : 0;
    const c     = ratioColor(ratio);

    // ── カード ──
    const card = document.createElement('div');
    card.className = 'card';
    card.style.borderLeftColor = c;

    const faultBadge = row.near_fault ? '<span class="badge b-fault">断層近</span>' : '';
    const hotBadge   = (row.score_hydrothermal > 0) ? '<span class="badge b-hot">熱水</span>' : '';

    card.innerHTML =
      '<div class="card-top">' +
        '<span class="card-score" style="color:' + c + '">' + score.toFixed(1) + '</span>' +
        '<span class="card-dist">📍 ' + (row.dist_km || '?') + 'km</span>' +
        faultBadge + hotBadge +
      '</div>' +
      '<div class="card-lith">' + (row.lithology_ja || '—') + '</div>' +
      '<div class="card-age">' + (row.formationage_ja || '—') + '</div>';

    card.onclick = () => map.setView([row.lat, row.lon], 13);
    list.appendChild(card);

    // ── マーカー（鉱物アイコン＋スコア連動グロー）──
    const r        = 4 + ratio * 7;
    const iconSize = Math.round(r * 2.4 + 4);
    const glowPx   = Math.round(2 + ratio * 6);
    const icon     = L.divIcon({
      html: '<div style="width:' + iconSize + 'px;height:' + iconSize + 'px;' +
            'filter:drop-shadow(0 0 ' + glowPx + 'px ' + c + ')">' +
            (MINERAL_ICON_SVG[mineral] || MINERAL_ICON_SVG.all) + '</div>',
      iconSize:   [iconSize, iconSize],
      iconAnchor: [iconSize / 2, iconSize / 2],
      className:  ''
    });
    const marker = L.marker([row.lat, row.lon], { icon });

    const gmapUrl   = 'https://maps.google.com/maps?q=' + row.lat + ',' + row.lon;
    const mName     = MINERAL_NAMES[mineral] || '合計';
    const breakdown = mineralBreakdown(row, data.mineral_labels);

    marker.bindPopup(
      '<span class="p-score" style="color:' + c + '">' + score.toFixed(1) + '</span>' +
      ' <span style="font-size:0.8rem;color:#8baabf">(' + mName + ')</span><br>' +
      '📍 調査地点から <b>' + (row.dist_km || '?') + ' km</b><br>' +
      '<div class="p-divider"></div>' +
      '<div class="p-rationale-title">📊 スコアの根拠</div>' +
      '<div class="p-rationale">' + buildRationale(row, mineral) + '</div>' +
      '<details class="p-breakdown"><summary>スコア内訳（数値）</summary>' +
      '<div class="p-minerals" style="margin-top:4px">' + (breakdown || '—') + '</div>' +
      '</details>' +
      '<div class="p-divider"></div>' +
      '<div class="p-formation"><strong>💡 生成プロセス:</strong><br>' +
      (MINERAL_FORMATION[mineral] || MINERAL_FORMATION.all) + '</div>' +
      '<a class="p-gmap" href="' + gmapUrl + '" target="_blank">📌 Google Maps で開く</a>' +
      '<button class="p-close" onclick="map.closePopup()">✕ 閉じる</button>',
      {
        maxWidth: 280,
        autoPanPaddingTopLeft:     L.point(10, 10),
        autoPanPaddingBottomRight: L.point(10, 90)
      }
    );

    resultLayer.addLayer(marker);
  });
}

// ── スコア根拠（自然言語）────────────────────────────────────
function buildRationale(row, mineral) {
  const lith = (row.lithology_ja    || '').trim();
  const age  = (row.formationage_ja || '').trim();
  const hs   = row.score_hydrothermal || 0;
  const ls   = row.score_locality     || 0;
  const lines = [];

  // ① 岩種
  const LITH_DESC = {
    'デイサイト':    '酸性の火山岩で、熱水による珪酸沈殿が起こりやすく、オパール・金・蛍石の母岩として好適です',
    '流紋岩':       '高珪酸の火山岩で、熱水変質によりオパールや金が形成されやすい岩種です',
    '花崗岩':       '深成岩で、冷却時にペグマタイト・熱水脈を形成して水晶や金を濃集します',
    'ペグマタイト':  '花崗岩の最終結晶に由来する粗粒岩で、水晶の産地として特に重要です',
    '蛇紋岩':       '超塩基性岩が変質した岩で、高圧低温変成作用によって翡翠を伴うことがあります',
    'スカルン':      '花崗岩と石灰岩の接触交代帯で、ガーネット・磁鉄鉱・蛍石が多産します',
    'ホルンフェルス': '花崗岩との接触変成帯で、スカルン型鉱物が含まれることがあります',
    '結晶片岩':     '高圧変成岩でガーネット・藍晶石・翡翠などを含みます',
    '片麻岩':       '高温高圧変成岩で、石英・ガーネット等を含むことがあります',
    '安山岩':       '中性の火山岩で、熱水鉱脈が発達した場合に金・銀・砂鉄が濃集します',
    '玄武岩':       '塩基性火山岩で磁鉄鉱を多く含み、砂鉄として川底に濃集しやすいです',
    '珪質':        '珪酸が集積した地層で、熱水変質によりオパール等の珪質鉱物が産出します',
    'チャート':     '珪酸微化石が固化した岩石で、変質によりオパールや輝安鉱を伴うことがあります',
    '凝灰岩':       '火山灰が固まった岩石で、熱水変質によりオパールや金が沈殿することがあります',
    '閃緑岩':       '深成岩の一種で、金・水晶を含む熱水脈を伴うことがあります',
    '砂岩':        '砂礫が固まった堆積岩です。上流の鉱床から金が運ばれて砂金として集積することがあります',
  };

  // ② 年代
  const AGE_DESC = {
    '完新世':  '現在も続く火山・温泉活動を含む最新期で、熱水変質が今も進行中です',
    '更新世':  '第四紀の火山活動が盛んな時期で、多くの温泉・熱水鉱床が形成されました',
    '鮮新世':  '火山活動が活発で珪化帯や金銀鉱床が形成されやすかった時代です',
    '中新世':  '日本の火山・熱水鉱床形成のピーク期で、砂金・オパール・輝安鉱の主産地がこの時代に形成されました',
    '漸新世':  '古第三紀の火成活動期で、一部に熱水鉱脈が形成されました',
    '白亜紀':  '大規模な花崗岩の貫入活動期で、スカルン・ペグマタイトが日本各地に形成されました',
    'ジュラ紀': '付加体が発達し高圧変成作用が起こった時代で、翡翠の生成時代として重要です',
    '三畳紀':  '変成岩・蛇紋岩帯が形成された時代で、翡翠やガーネットの母岩が生成されました',
    '古生代':  '付加体・変成帯が広く分布し、変成鉱物の産地が多くあります',
  };

  let lithText = null;
  for (const [kw, desc] of Object.entries(LITH_DESC)) {
    if (lith.includes(kw)) { lithText = desc; break; }
  }
  if (lith && lith !== '—') {
    lines.push('🪨 <b>' + lith + '</b>' +
      (lithText ? '：' + lithText + '。' : '。'));
  }

  let ageText = null;
  for (const [kw, desc] of Object.entries(AGE_DESC)) {
    if (age.includes(kw)) { ageText = desc; break; }
  }
  if (age && age !== '—') {
    lines.push('📅 地質年代は<b>' + age + '</b>' +
      (ageText ? '：' + ageText + '。' : '。'));
  }

  if (row.near_fault) {
    lines.push('⚡ <b>断層帯の近く（5km以内）</b>：断層沿いを流れる熱水が鉱物成分を濃集させる鉱脈が発達しやすい環境です。');
  }

  if (hs >= 3) {
    lines.push('🌋 <b>完新世火山岩域の内部</b>：現役の火山・温泉帯の中心で、今も続く熱水変質が最も強い地域です。');
  } else if (hs >= 2) {
    lines.push('🌋 <b>完新世火山岩から5km圏内</b>：現役の温泉・火山帯に近く、熱水変質の影響が強い地域です。');
  } else if (hs >= 1) {
    lines.push('🔥 <b>完新世火山岩から10km圏内</b>：比較的新しい火山活動の周辺に位置します。');
  }

  if (ls > 0 && row.nearest_locality) {
    lines.push('⭐ <b>既知産地近接</b>：' + row.nearest_locality + 'の産出記録に近い地点です。');
  }

  return lines.length > 0 ? lines.join('<br>') : '地質図データに基づいてスコアを算出しました。';
}

// ── 既知産地・伝説レイヤー ───────────────────────────────────
const localityLayer = L.layerGroup().addTo(map);
const legendLayer   = L.layerGroup().addTo(map);
let localityVisible = true;
let legendVisible   = true;

function makeLocalityIcon(mineral, confidence) {
  const color = MINERAL_COLORS[mineral] || '#f0b429';
  const size  = confidence === 3 ? 28 : confidence === 2 ? 22 : 17;
  const glow  = confidence === 3 ? 5  : confidence === 2 ? 3  : 2;
  return L.divIcon({
    html: '<div style="width:' + size + 'px;height:' + size + 'px;' +
          'display:flex;align-items:center;justify-content:center;' +
          'font-size:' + Math.round(size * 0.8) + 'px;' +
          'filter:drop-shadow(0 0 ' + glow + 'px ' + color + ')">⭐</div>',
    iconSize:   [size, size],
    iconAnchor: [size / 2, size / 2],
    className:  ''
  });
}

const LEGEND_ICON = L.divIcon({
  html: '<div style="width:26px;height:26px;display:flex;align-items:center;' +
        'justify-content:center;font-size:20px;' +
        'filter:drop-shadow(0 0 4px #f39c12)">📜</div>',
  iconSize:   [26, 26],
  iconAnchor: [13, 13],
  className:  ''
});

function renderLocalityLayer(localities) {
  localityLayer.clearLayers();
  localities.forEach(function(loc) {
    const icon    = makeLocalityIcon(loc.mineral, loc.confidence);
    const stars   = '★'.repeat(loc.confidence) + '☆'.repeat(3 - loc.confidence);
    const gmapUrl = 'https://maps.google.com/maps?q=' + loc.lat + ',' + loc.lon;
    const marker  = L.marker([loc.lat, loc.lon], { icon });
    marker.bindTooltip(loc.name, { direction:'top', offset:[0, -8] });
    marker.bindPopup(
      '<div class="p-locality-name">⭐ ' + loc.name + '</div>' +
      '<span style="color:#f0b429">' + stars + '</span>' +
      ' <span style="font-size:0.78rem;color:#8baabf">信頼度 ' + loc.confidence + '/3</span><br>' +
      '🔮 <b>' + loc.mineral_name + '</b><br>' +
      '📋 ' + (loc.note || '—') + '<br>' +
      '<div class="p-divider"></div>' +
      '<a class="p-gmap" href="' + gmapUrl + '" target="_blank">📌 Google Maps で開く</a>' +
      '<button class="p-close" onclick="map.closePopup()">✕ 閉じる</button>',
      { maxWidth:260, autoPanPaddingTopLeft:L.point(10,10), autoPanPaddingBottomRight:L.point(10,90) }
    );
    localityLayer.addLayer(marker);
  });
}

function renderLegendLayer() {
  legendLayer.clearLayers();
  LEGEND_SPOTS.forEach(function(spot) {
    const gmapUrl = 'https://maps.google.com/maps?q=' + spot.lat + ',' + spot.lon;
    const marker  = L.marker([spot.lat, spot.lon], { icon: LEGEND_ICON });
    marker.bindTooltip(spot.name, { direction:'top', offset:[0, -8] });
    marker.bindPopup(
      '<div class="p-legend-title">📜 ' + spot.name + '</div>' +
      '<span style="color:#f39c12;font-size:0.78rem">⚒ ' + spot.mineral + '</span>' +
      '&ensp;<span style="color:#8baabf;font-size:0.75rem">🗓 ' + spot.era + '</span><br>' +
      '<div class="p-divider"></div>' +
      '<div class="p-legend-text">' + spot.text + '</div>' +
      '<div class="p-divider"></div>' +
      '<a class="p-gmap" href="' + gmapUrl + '" target="_blank">📌 Google Maps で開く</a>' +
      '<button class="p-close" onclick="map.closePopup()">✕ 閉じる</button>',
      { maxWidth:290, autoPanPaddingTopLeft:L.point(10,10), autoPanPaddingBottomRight:L.point(10,90) }
    );
    legendLayer.addLayer(marker);
  });
}

function toggleLayer(type) {
  if (type === 'locality') {
    localityVisible = !localityVisible;
    localityVisible ? map.addLayer(localityLayer) : map.removeLayer(localityLayer);
    document.getElementById('btnLocalityLayer').classList.toggle('active', localityVisible);
  } else if (type === 'legend') {
    legendVisible = !legendVisible;
    legendVisible ? map.addLayer(legendLayer) : map.removeLayer(legendLayer);
    document.getElementById('btnLegendLayer').classList.toggle('active', legendVisible);
  } else if (type === 'river') {
    riverVisible = !riverVisible;
    riverVisible ? map.addLayer(riverLayer) : map.removeLayer(riverLayer);
    document.getElementById('btnRiverLayer').classList.toggle('active', riverVisible);
  }
}

// ── 河川スコアレイヤー ──────────────────────────────────────────

function renderRiverLayer(data) {
  riverLayer.clearLayers();
  const maxScore = data.max_score || 1;
  const refKm    = data.ref_radius || '?';
  const mineral  = data.mineral === 'all' ? '全鉱物' : (MINERAL_NAMES[data.mineral] || data.mineral);

  if (data.warning) console.warn('Overpass:', data.warning);

  data.features.forEach(function(f) {
    const score   = f.properties.score;
    const ratio   = (score > 0 && maxScore > 0) ? score / maxScore : 0;
    const color   = score > 0 ? ratioColor(ratio) : '#2d4a6e';
    const weight  = f.properties.waterway === 'river' ? 5 : 2;
    const opacity = score > 0 ? 0.85 : 0.3;
    const coords  = f.geometry.coordinates.map(function(c) { return [c[1], c[0]]; });

    const line = L.polyline(coords, { color, weight, opacity });

    const name = f.properties.name || '（名称不明）';
    line.bindTooltip(
      name + (score > 0
        ? '&ensp;スコア <b>' + score.toFixed(1) + '</b>'
        : '&ensp;<span style="color:#8baabf">スコアなし</span>') +
      '<br><span style="font-size:0.72rem;color:#aaa">上流 ' + refKm + 'km 参照（' + mineral + ' 比重由来）</span>',
      { sticky: true }
    );
    riverLayer.addLayer(line);
  });

  riverFetched = true;
  const btn = document.getElementById('btnRiverLayer');
  if (btn) {
    btn.textContent = '河川スコア';
    btn.disabled    = false;
    riverVisible = true;
    btn.classList.add('active');
  }
}

function onRiverLayerBtn() {
  if (!riverFetched) {
    fetchRivers();
  } else {
    toggleLayer('river');
  }
}

async function fetchRivers() {
  if (!selLat) return;

  // 前のリクエストをキャンセル
  if (riverAbortController) riverAbortController.abort();
  riverAbortController = new AbortController();
  const signal = riverAbortController.signal;

  const btn = document.getElementById('btnRiverLayer');
  if (btn) { btn.textContent = '河川 取得中…'; btn.disabled = true; btn.classList.remove('active'); }
  riverLayer.clearLayers();

  const radius  = document.getElementById('radiusSl').value;
  const mineral = document.getElementById('mineralSel').value;

  try {
    const resp = await fetch(
      '/api/rivers?lat=' + selLat + '&lon=' + selLon +
      '&radius_km=' + radius + '&mineral=' + mineral,
      { signal }
    );
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    if (data.error) throw new Error(data.error);
    renderRiverLayer(data);
  } catch(e) {
    if (e.name === 'AbortError') return;  // キャンセル済み：何もしない
    console.warn('河川データ取得失敗:', e.message);
    if (btn) { btn.textContent = '河川 取得失敗'; btn.disabled = false; }
  }
}

// ── オーバーレイレイヤー（保護区・温泉・鉱山跡）──────────────────────
const parkLayer      = L.layerGroup().addTo(map);
const hotspringLayer = L.layerGroup();
const mineLayer      = L.layerGroup();
let overlayFetched        = false;
let overlayData           = null;
let overlayAbortController = null;
let parkVisible      = true;
let hotspringVisible = false;
let mineVisible      = false;

function renderParkLayer(parks) {
  parkLayer.clearLayers();
  parks.forEach(function(p) {
    const icon = L.divIcon({
      html: '<div style="width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:18px;filter:drop-shadow(0 0 5px #e74c3c)">🚫</div>',
      iconSize: [26, 26], iconAnchor: [13, 13], className: ''
    });
    const m = L.marker([p.lat, p.lon], { icon });
    m.bindTooltip('⚠ ' + p.park_type + ': ' + p.name, { direction: 'top', offset: [0, -8] });
    m.bindPopup(
      '<b style="color:#e74c3c">⚠ ' + p.park_type + '</b><br>' +
      '<b>' + p.name + '</b><br>' +
      '<div class="p-divider"></div>' +
      '<div style="color:#f5b7b1;font-size:0.8rem;line-height:1.6">' +
      '自然公園法により、国立・国定公園内での鉱物・岩石の採集は原則禁止されています。<br>' +
      '採集前に必ず公園の種別と規制内容を確認してください。</div>' +
      '<button class="p-close" onclick="map.closePopup()">✕ 閉じる</button>',
      { maxWidth: 260, autoPanPaddingTopLeft: L.point(10,10), autoPanPaddingBottomRight: L.point(10,90) }
    );
    parkLayer.addLayer(m);
  });
}

function renderHotspringLayer(hotsprings) {
  hotspringLayer.clearLayers();
  hotsprings.forEach(function(h) {
    const icon = L.divIcon({
      html: '<div style="width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:18px;filter:drop-shadow(0 0 4px #e67e22)">♨</div>',
      iconSize: [24, 24], iconAnchor: [12, 12], className: ''
    });
    const m = L.marker([h.lat, h.lon], { icon });
    m.bindTooltip(h.name, { direction: 'top', offset: [0, -8] });
    const gmapUrl = 'https://maps.google.com/maps?q=' + h.lat + ',' + h.lon;
    m.bindPopup(
      '<b style="color:#e67e22">♨ 温泉・熱水</b><br>' +
      '<b>' + h.name + '</b><br>' +
      '<div class="p-divider"></div>' +
      '<div style="font-size:0.78rem;color:#aaa;line-height:1.6">熱水変質帯の指標。周辺の珪質岩・変質帯を確認してください。オパール・輝安鉱・菱マンガン鉱の探索に有効です。</div>' +
      '<a class="p-gmap" href="' + gmapUrl + '" target="_blank">📌 Google Maps で開く</a>' +
      '<button class="p-close" onclick="map.closePopup()">✕ 閉じる</button>',
      { maxWidth: 250, autoPanPaddingTopLeft: L.point(10,10), autoPanPaddingBottomRight: L.point(10,90) }
    );
    hotspringLayer.addLayer(m);
  });
}

function renderMineLayer(mines) {
  mineLayer.clearLayers();
  mines.forEach(function(mi) {
    const icon = L.divIcon({
      html: '<div style="width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:18px;filter:drop-shadow(0 0 4px #f0b429)">⛏</div>',
      iconSize: [24, 24], iconAnchor: [12, 12], className: ''
    });
    const m = L.marker([mi.lat, mi.lon], { icon });
    m.bindTooltip(mi.mine_type + ': ' + mi.name, { direction: 'top', offset: [0, -8] });
    const gmapUrl = 'https://maps.google.com/maps?q=' + mi.lat + ',' + mi.lon;
    m.bindPopup(
      '<b style="color:#f0b429">⛏ ' + mi.mine_type + '</b><br>' +
      '<b>' + mi.name + '</b><br>' +
      '<div class="p-divider"></div>' +
      '<div style="font-size:0.78rem;color:#aaa;line-height:1.6">旧採掘地。廃ズリ・坑口・露頭が残存する場合があります。坑道への立入りは危険です。</div>' +
      '<a class="p-gmap" href="' + gmapUrl + '" target="_blank">📌 Google Maps で開く</a>' +
      '<button class="p-close" onclick="map.closePopup()">✕ 閉じる</button>',
      { maxWidth: 250, autoPanPaddingTopLeft: L.point(10,10), autoPanPaddingBottomRight: L.point(10,90) }
    );
    mineLayer.addLayer(m);
  });
}

async function fetchOverlays() {
  if (!selLat) return;

  if (overlayAbortController) overlayAbortController.abort();
  overlayAbortController = new AbortController();
  const signal = overlayAbortController.signal;

  const radius = document.getElementById('radiusSl').value;
  try {
    const resp = await fetch(
      '/api/overlays?lat=' + selLat + '&lon=' + selLon + '&radius_km=' + radius,
      { signal }
    );
    const data = await resp.json();
    overlayData  = data;
    overlayFetched = true;

    // 保護区: データがあれば自動表示
    renderParkLayer(data.parks || []);
    const parkBtn = document.getElementById('btnParkLayer');
    if (parkBtn) {
      parkBtn.disabled = false;
      const cnt = (data.parks || []).length;
      parkBtn.textContent = '🚫 保護区' + (cnt > 0 ? ' (' + cnt + ')' : '');
      parkBtn.classList.toggle('active', cnt > 0);
      parkVisible = cnt > 0;
    }

    // 温泉・鉱山跡: ボタンを有効化（表示はユーザー操作）
    const hsBtn = document.getElementById('btnHotspringLayer');
    const miBtn = document.getElementById('btnMineLayer');
    if (hsBtn) {
      hsBtn.disabled = false;
      const cnt = (data.hotsprings || []).length;
      hsBtn.textContent = '♨ 温泉' + (cnt > 0 ? ' (' + cnt + ')' : '');
    }
    if (miBtn) {
      miBtn.disabled = false;
      const cnt = (data.mines || []).length;
      miBtn.textContent = '⛏ 鉱山跡' + (cnt > 0 ? ' (' + cnt + ')' : '');
    }
  } catch(e) {
    if (e.name === 'AbortError') return;
    console.warn('Overlay fetch failed:', e);
  }
}

function onParkLayerBtn() {
  if (!overlayFetched) return;
  parkVisible = !parkVisible;
  parkVisible ? map.addLayer(parkLayer) : map.removeLayer(parkLayer);
  document.getElementById('btnParkLayer').classList.toggle('active', parkVisible);
}

function onOverlayBtn(type) {
  if (!overlayFetched) return;
  if (type === 'hotspring') {
    hotspringVisible = !hotspringVisible;
    if (hotspringVisible) {
      renderHotspringLayer(overlayData.hotsprings || []);
      map.addLayer(hotspringLayer);
    } else {
      map.removeLayer(hotspringLayer);
    }
    document.getElementById('btnHotspringLayer').classList.toggle('active', hotspringVisible);
  } else if (type === 'mine') {
    mineVisible = !mineVisible;
    if (mineVisible) {
      renderMineLayer(overlayData.mines || []);
      map.addLayer(mineLayer);
    } else {
      map.removeLayer(mineLayer);
    }
    document.getElementById('btnMineLayer').classList.toggle('active', mineVisible);
  }
}

// 既知産地をAPIから取得
fetch('/api/localities')
  .then(function(r) { return r.json(); })
  .then(function(data) { renderLocalityLayer(data.localities); })
  .catch(function() {});

// 伝説・逸話レイヤーを描画
renderLegendLayer();
</script>
